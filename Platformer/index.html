    function drawParallax() {
      ctx.drawImage(backgroundBlank, 0, 0, canvas.width, canvas.height);
      for (let i = 0; i < clouds.length; i++) {
        let offset = clouds[i].x + clouds[i].speed;

        if (offset > 500) {

        clouds[i].x = offset;

    document.addEventListener("keydown", function (event) {

    function startGame(e) {

          ctx.font = "24px 'Press Start 2P'";
          ctx.textAlign = "center";

        frame++;

      }

    }

    function gameOverScreen() {
      //cant get gamer over text to blink and its pmo
      isGameOver = true;
      ctx.drawImage(gameOver, 0, 0, canvas.width, canvas.height);

      function blinkRestartText() {
        if (!isGameOver) return;

        ctx.drawImage(gameOver, 0, 0, canvas.width, canvas.height);

        if (blinkFrame % 30 < 15) {
          ctx.fillStyle = "white";
          ctx.font = "24px 'Press Start 2P'";
          ctx.textAlign = "center";
          ctx.fillText("Press Enter", canvas.width / 2, canvas.height - 100);
        }

        blinkFrame++;
        requestAnimationFrame(blinkRestartText);
      }

      blinkRestartText();
      document.addEventListener("keydown", startGame);
    }

    function resetGame() {
      snake.x = 0;
      snake.y = 37;
      snake.direction = 0;

      gameObjects.score = 0;

      snakeJoints = createSnake();

      spawnRandomCoin();

      titleMusic.currentTime = 0;

    function scoreCounter(score) {
      const boxWidth = 50;
      const boxHeight = 30;
      const x = canvas.width - boxWidth - 5;
      const y = 5;

      (ctx.fillStyle = "lilac"), ctx.fillRect(x, y, boxWidth, boxHeight);

      ctx.fillStyle = "white";
      ctx.font = "15px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(score, x + boxWidth / 2, y + boxHeight / 2); //divide by two so it centers
    }

    function updateScore() {
      gameObjects.score = gameObjects.score + 10;
    }

    //Display Highscore

    function calculateDistance(pointA, pointB) {
      //Calculating the distance between two points
      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;

      return Math.sqrt(dx * dx + dy * dy);
    }

    function constrainDistance(point, anchor, length) {
      let distance = calculateDistance(point, anchor);
      if (distance === 0) {
        return;
      }

      const ratio = length / distance;

      const dx = point.x - anchor.x;
      const dy = point.y - anchor.y;

      (point.x = anchor.x + dx * ratio), (point.y = anchor.y + dy * ratio);
    }

    function createSnake() {
      //Homework: This function confuses the hell out of me but I think I have a slightly
      //...better understanding of it. Since relating it to bubble sort, I can see that we are creating a snake joint by joint
      //...using the end of the last joint as the beginning of the next joint
      let snakeLength = [];
      let newStart = {
        x: 0,
        y: 0,
      };
      for (let i = 0; i < snake.joints; i++) {
        //Homework: Why did we use a for loop here? To loop over the object SNAKE and add JOINTS as we create them.
        const joint = {
          path: new Path2D(),
          xStart: 0,
          yStart: 0,
          point: {
            x: 0,
            y: 0,
          },
        };

        if (i === 0) {
          //Homework: if i is equal to 0, the starting x and y position is the current x and y position of whatever is in the snake object
          joint.point.x = snake.x;
          joint.point.y = snake.y;
        } else {
          joint.point.x = newStart.x; //Homework: Else, the starting x/y position is the NEW x/y position which is the end of the last joint +10 offset
          joint.point.y = newStart.y;
        }

        newStart.x = joint.point.x - snake.jointDistance;
        newStart.y = joint.point.y - snake.jointDistance;

        snakeLength.push(joint); //Homework: After all is said and done, push the new joint to the snakeLength array defined at the beginning of the function
      }
      return snakeLength;
    }

    snakeJoints = createSnake();

    function checkCollision() {
      let head = snakeJoints[0].point;
      for (let i = 2; i < snakeJoints.length; i++) {
        let currentJoint = snakeJoints[i].point;
        let distance = calculateDistance(head, currentJoint);
        if (distance < 10) {
          isGameOver = true;
          gameOverScreen();
          titleMusic.pause();
          titleMusic.currentTime = 0;
          playGameOver();

          return true;
          console.log("Close");
        }
      }
      return false;
    }

    function updateSnake() {
      snakeJoints[0].point.x = snake.x;
      snakeJoints[0].point.y = snake.y;

      snakeJoints[0].path = new Path2D();

      for (let i = 1; i < snakeJoints.length; i++) {
        let point = snakeJoints[i].point;

        let anchor = snakeJoints[i - 1].point;
        snakeJoints[i].path = new Path2D();

        constrainDistance(point, anchor, snake.jointDistance);
      }
    }

    function addSnakeJoint() {
      let lastJoint = snakeJoints[snakeJoints.length - 1];
      let newJoint = {
        path: new Path2D(),
        point: {
          x: 0,
          y: 0,
        },
      };
      newJoint.point.x = lastJoint.point.x + snake.jointDistance;
      newJoint.point.y = lastJoint.point.y + snake.jointDistance;

      snakeJoints.push(newJoint);
    }

    function drawPoint(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "violet";
      ctx.fill();
    }

    function drawSnakeDebug() {
      for (let i = 0; i < snakeJoints.length; i++) {
        let joint = snakeJoints[i];
        ctx.stroke(joint.path);
        drawPoint(joint.point.x, joint.point.y);
      }
    }

    function gameLoop(timestamp) {
      console.log(timestamp);
      if (isGameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(canvasBackground, 0, 0, canvas.width, canvas.height); //Not working? Why is this failing?

      if (
        !(
          //!Is not
          (
            snake.x >= 0 &&
            snake.y >= 0 &&
            snake.x <= canvas.width &&
            snake.y <= canvas.height
          )
        )
      ) {
        isGameOver = true;
        gameOverScreen();
        titleMusic.pause();
        titleMusic.currentTime = 0;
        playGameOver();

        return;
      }

      //is basically a for loop
      //all calc happens between wiping and drawing

      //Game Object Creation
      //Define all new game objects here

      updateSnake();
      if (checkCollision() === true) {
        isGameOver = true;
        gameOverScreen();
        titleMusic.pause();
        titleMusic.currentTime = 0;
        playGameOver();

        return;
      }
      scoreCounter(gameObjects.score);

      //createCoin(100, 100, 10);

      //Create all game objects dimensions

      for (let i = 1; i < snakeJoints.length; i++) {
        const joint = snakeJoints[i];
        const previousJoint = snakeJoints[i - 1];
        previousJoint.path.moveTo(previousJoint.point.x, previousJoint.point.y);
        previousJoint.path.lineTo(joint.point.x, joint.point.y);
      }

      //All game calculations below this point

      if (keys.a) snake.direction -= 0.01;
      if (keys.d) snake.direction += 0.01;

      //automatic movement
      snake.x += Math.cos(snake.direction) * snake.speed;
      snake.y += Math.sin(snake.direction) * snake.speed;
      console.log(snake.x);
      console.log(snake.y);

      crownOffset += crownDirection * 0.3;
      if (crownOffset > 5 || crownOffset < -5) {
        // || = OR
        crownDirection *= -1;
      }

      //After all calculations, draw

      // const coinPath = new Path2D();
      // coinPath.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
      // ctx.fillStyle = "pink";
      // ctx.fill(coinPath);
      ctx.drawImage(
        crownSprite,
        coin.x - coin.radius,
        coin.y - coin.radius + crownOffset,
        coin.radius * 2,
        coin.radius * 2
      );

      // if (ctx.isPointInPath(coinPath, snake.x, snake.y)) {
      //   updateScore();
      //   playPop();
      //   addSnakeJoint();
      //   spawnRandomCoin();
      // }

      if (
        snake.x > coin.x - coin.radius &&
        snake.x < coin.x + coin.radius &&
        snake.y > coin.y - coin.radius &&
        snake.y < coin.y + coin.radius
      ) {
        updateScore();
        playPop();
        addSnakeJoint();
        spawnRandomCoin();
      }

      drawSnakeDebug();
      //drawSnake();
      frame++;
      requestAnimationFrame(gameLoop);
    }
